name: RSS hírek lekérése

on:
  schedule:
    - cron: '*/30 * * * *'  # 30 percenként
  workflow_dispatch:          # Kézi indítás is (Actions fülön)

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Engedély a repo módosításához
    
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4
      
      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: RSS lekérés futtatása
        run: node fetch-rss.js
      
      - name: Változások mentése a repóba
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirek.json
          git commit -m "RSS frissítés $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
