name: RSS hírek lekérése

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # Módosítva: 20 -> 24

      - name: RSS lekérés futtatása
        run: node fetch-rss.js
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Új: kényszeríti a Node 24 használatát

      - name: Változások mentése a repóba
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirek.json
          git commit -m "RSS frissítés $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
